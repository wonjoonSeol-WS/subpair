title: Subpair
description: Learn a language from the shows you watch. Two subtitle lines at once on Netflix and Jellyfin, with free local or AI translation. An open-source alternative to Language Reactor.
repo_url: https://github.com/wonjoonSeol/subpair
subsync_repair_url: https://github.com/wonjoonSeol/subsync-repair/releases/latest
# Store listings. While a store's *_in_review is true the pages show it as "in review" and send its users to the latest
# GitHub release instead; set it to false once that store has approved Subpair.
chrome_store_url: https://chromewebstore.google.com/detail/ffohiiambkeeinlkdknkfnnnbpnfbpae
firefox_store_url: https://addons.mozilla.org/firefox/addon/subpair/
chrome_in_review: false
firefox_in_review: true
language_reactor_url: https://www.languagereactor.com/
releases_url: https://github.com/wonjoonSeol/subpair/releases/latest
# GoatCounter site code (the name before .goatcounter.com) for counting visits to these pages; empty means no counter.
goatcounter: subpair
markdown: kramdown
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - README.md
# Text the layout shows on every page, per language.
i18n:
  en:
    description: "Learn a language from the shows you watch. Two subtitle lines at once on Netflix and Jellyfin, with free local translation or AI translation. An open-source alternative to Language Reactor."
    license: "MIT License"
    not_affiliated: "Not affiliated with Netflix, Jellyfin or Language Reactor."
    more_projects: "Try my other open source projects"
  ko:
    description: "좋아하는 작품으로 외국어 공부. Netflix와 Jellyfin에서 배우는 언어와 모국어 자막을 한 화면에 띄우고, 자막이 없으면 PC나 AI로 번역해요. 무료 오픈소스 Language Reactor 대안."
    license: "MIT 라이선스"
    not_affiliated: "Netflix, Jellyfin, Language Reactor와 관련이 없습니다."
    more_projects: "다른 오픈소스도 써 보기"
  ja:
    description: "いつも見ている作品で語学を学べます。NetflixとJellyfinで字幕を2行同時に表示し、無料のローカル翻訳やAI翻訳に対応します。Language Reactorのオープンソースの代替です。"
    license: "MITライセンス"
    not_affiliated: "Netflix、Jellyfin、Language Reactorとは関係ありません。"
    more_projects: "ほかのオープンソースも試す"
